name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: groundzero
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: groundzero_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U groundzero -d groundzero_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://groundzero:ci-only-password@127.0.0.1:5432/groundzero_test
      TEST_DATABASE_URL: postgresql://groundzero:ci-only-password@127.0.0.1:5432/groundzero_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npx tsx scripts/prune-auth.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:production
      - run: npm run test:e2e
      - run: npm run test:passkeys
